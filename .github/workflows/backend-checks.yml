name: Backend Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: python -m ruff check app tests

      - name: Test
        working-directory: backend
        run: python -m pytest

